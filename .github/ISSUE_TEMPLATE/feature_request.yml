name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Please
        describe the use case so we can evaluate the request.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: |
        What are you trying to do? What problem does this
        solve? Is this related to a frustration with the
        current behavior?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: |
        How would you like this to work? Include example
        Ruby snippets, attribute suffixes, validator options,
        or API surface if applicable.
      render: ruby
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: |
        Have you considered other approaches or workarounds
        (Chronic directly, custom setter, alternative gem)?
        What are their drawbacks?

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this affect?
      options:
        - Parser (SmarterDates::Parser)
        - ActiveRecord integration
        - Plain Ruby integration
        - String refinements (core_ext)
        - ChronicParsableValidator
        - Custom types (ChronicDateType / ChronicDateTimeType)
        - Railtie / locales / i18n
        - Documentation
        - Other

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: |
        Links, references, example natural-language inputs,
        or anything else that helps explain the request.
