# CI — lint, test matrix, audit.
#
# Actions pinned to full SHA for supply-chain safety.
# Concurrency: cancel stale runs on same branch/PR.
#
# Matrix: Ruby 3.4 + 4.0 × ActiveRecord 7.2 + 8.1
# Each cell selects gemfiles/activerecord_<ver>.gemfile via BUNDLE_GEMFILE.
# Cell lockfiles are gitignored; each run resolves fresh.
---
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths:
      - "lib/**"
      - "spec/**"
      - "config/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "gemfiles/**"
      - "smarter_dates.gemspec"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "lib/**"
      - "spec/**"
      - "config/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "gemfiles/**"
      - "smarter_dates.gemspec"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec standardrb --no-fix
      - run: bundle exec reek lib/

  test:
    name: test (ruby ${{ matrix.ruby }}, ${{ matrix.gemfile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.4"
            gemfile: gemfiles/activerecord_7.2.gemfile
          - ruby: "3.4"
            gemfile: gemfiles/activerecord_8.1.gemfile
          - ruby: "4.0"
            gemfile: gemfiles/activerecord_8.1.gemfile
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec bundler-audit check --update
